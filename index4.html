<!DOCTYPE html>
<html>
<head>
	<style>
		button{
			background-color: #22C784;
			border: 1px solid #1A9E6A;
			height: 35px;
			padding: 0px 16px;
			border-radius:8px;
			color: white;
			cursor: pointer;
		}
		
		body{
		 	display: flex;
	    	flex-direction: column;
	    	align-items: center;
	    	background-color: #f1efef;
	    	gap: 33px;
		}
		
		.add-todo-section {
			width:100%;
		}
		
		form {
			width: 100%;
	    	display: flex;
	    	flex-direction: row;
	    	justify-content: space-between;
	    	gap: 11px;
		}
		
		form input {
			flex: 1;
			height: 31px;
	    	border-radius: 10px;
	    	border: 1px solid lightgray;
	    	padding-left: 12px;
		}
		
		hr {
	    	background-color: #1A9E6A;
	    	height: 6px;
	    	width: 81px;
	    	border-radius: 8px;
	
		}
		
		.todo-list-section {
			width:100%;
		}
		
		.todo-list-section ul {
			display: flex;
	    	flex-direction: column;
	    	gap: 11px;
	    	padding: 0px;
	    	margin: 0px;
	    	margin: 0px;
		}
		
		.todo-list-section ul li {
			list-style: none;
		}
		
		.todo-list-section ul li article {
			border: 1px solid lightgray;
	    	display: flex;
	    	flex-direction: row;
	    	justify-content: space-between;
	    	align-items: center;
			padding: 22px;
	    	border-radius: 14px;
	    	background-color: white;
		}
		
		.todo-list-section ul li article.complete {
			background-color: #7fddb7;
		}
		
	</style>
	<meta charset="UTF-8">
	<title>simple Todo View</title>
</head>

<body>
	<section class="add-todo-section" >
		<form id="add_todo">
			<input type="text" name="title" placeholder="새로운 일정을 추가하세요."/>
			<button type="submit">추가</button>
		</form>
	</section>

	<hr/>

	<section class="todo-list-section">
		<ul id="todoListUl">				
		</ul>
	</section>

</body>
<script>
	// 	getTodoList에서 반환한 값을 화면에서 사용하기 위해 전역변수로 담는다.
	// let parseTodoList = [];
	
	// parseTodoList = getTodoList();
	setTodoListUi();
	

	// 일정 목록 가져오기
	function getTodoList() {
		// 로컬스토리지에서 가져온 데이터를 담을 변수 선언 "[{},{}]"(로컬스토리지는 문자열로 담아서 가져옴)
		let todoList = localStorage.getItem('todoList'); 
		// 로컬스토리지에서 가져온 데이터가 빈 값일 경우도 생각해야한다
		if( todoList == null) {
			todoList = '[]';
		}
		// 가져온 데이터를 파싱한다.(json형식으로) , 배열로 읽어야 되기 때문에 파싱을 한다([{},{}]) 
		let parseList = JSON.parse(todoList);
		// 파싱한 데이터 값을 변수를 선언하여 담는다.
		let parseTodoList = parseList;
		// 변수를 반환한다.
		return parseTodoList;
		
	}
	
	// 일정 목록 화면에 생성하기
	function setTodoListUi() {

		// 일정 목록 가져와서 변수에 담기
		let todoList = getTodoList(); // [ {title: "일정1", isCompleted: false}, {title: "일정2", isCompleted: false} ]
		// 일정 목록을 담을 ul태그 가져오기
		let todoListUl = document.getElementById('todoListUl');
		// todoList 순회하면서 title 값 추출
		// todoList[0].title == "일정1"
		// todoList[1].title == "일정2"
		for( let i = 0; i < todoList.length; i++ ) {
			// i번째 투두일정 추출
			let todo = todoList[i];
			// i번째 투두일정의 title 추출
			let title = todo.title;
			// isCompleted 변수 선언
			let isCompleted = todo.isCompleted;
			// id 변수 선언
			let id = "list" + i;
			
			todoListUl.innerHTML += `
			<li>
				<article>
					<div>
						<input type="checkbox" id="${id}" ${ isCompleted ? "checked" : "" }/>
						<label for="${id}">${title}</label>
					</div>
					<div>
						<button>삭제</button>
					</div>
				</article>			
			</li>`;
		}
	}		
		
		/*
		// 화면에 보여줄 반환 값을 담기위해
		let todoListUl = parseTodoList;
		// 선언한 값 중 제목만 가지고 온다.
		let todoListTitle = todoListUl.getItem('title');
		// 선언한 변수를 이용하여 for문으로 목록을 차례대로 생성한다.
		for( i = 0; i < todoListTitle; i++) {
			// 생성 된 값을 html에 적용한다.
			return 
		}
		*/
		
	
	
</script>

</html>
